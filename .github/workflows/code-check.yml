name: code-check

on:
  push:
  pull_request:

jobs:
  shell-code-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shell tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y shellcheck shfmt

      - name: Run shell lints
        shell: bash
        run: make lint

      - name: Run shell format check
        shell: bash
        run: make fmt-check
